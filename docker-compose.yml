services:
  db:
    image: postgres:15
    env_file: ".env"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksusha -d store"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: ".env"
    depends_on:
      db:
        condition: service_healthy
